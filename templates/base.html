<!doctype html>
<html>
  <head>
    <title>{% block title %}Dashboard{% endblock %} — HR Intelligence</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --font: "DM Sans", sans-serif;
        --sidebar-w: 180px;
        --blue: #1a56db;
        --blue-dark: #1240a8;
        --blue-light: #eff4ff;
        --border: #e8eaf0;
        --bg: #f4f5f9;
        --text: #111827;
        --text-muted: #6b7280;
        --text-faint: #9ca3af;
        --radius: 10px;
        --shadow: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
      }
      body {
        font-family: var(--font);
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
      }

      /* Shell */
      .shell {
        display: flex;
        min-height: 100vh;
      }

      /* Sidebar */
      .sidebar {
        width: var(--sidebar-w);
        background: #fff;
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        position: fixed;
        top: 0;
        left: 0;
        height: 100vh;
        padding: 20px 0;
        z-index: 50;
      }
      .sidebar-brand {
        padding: 0 18px 18px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 12px;
      }
      .sidebar-brand-sub {
        font-size: 10px;
        font-weight: 600;
        color: var(--text-faint);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .sidebar-brand-name {
        font-size: 15px;
        font-weight: 600;
        color: var(--text);
        margin-top: 3px;
        line-height: 1.3;
      }

      .sidebar-upload {
        margin: 0 12px 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        background: var(--blue);
        color: white;
        padding: 9px 12px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        border: none;
        width: calc(100% - 24px);
        font-family: var(--font);
        text-decoration: none;
      }
      .sidebar-upload:hover {
        background: var(--blue-dark);
        color: white;
      }

      .sidebar-section-label {
        font-size: 10px;
        font-weight: 700;
        color: var(--text-faint);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 0 18px;
        margin: 4px 0 6px;
      }
      .sidebar-item {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 8px 18px;
        font-size: 13px;
        color: var(--text-muted);
        cursor: pointer;
        text-decoration: none;
        transition:
          background 0.1s,
          color 0.1s;
      }
      .sidebar-item:hover {
        background: var(--bg);
        color: var(--text);
      }
      .sidebar-item.active {
        background: var(--blue-light);
        color: var(--blue);
        font-weight: 500;
      }
      .sidebar-item svg {
        width: 15px;
        height: 15px;
        flex-shrink: 0;
      }

      .sidebar-submenu {
        overflow: hidden;
        max-height: 0;
        transition: max-height 0.25s ease;
      }
      .sidebar-submenu.open {
        max-height: 120px;
      }
      .sidebar-subitem {
        display: block;
        padding: 6px 18px 6px 42px;
        font-size: 12px;
        color: var(--text-muted);
        text-decoration: none;
      }
      .sidebar-subitem:hover {
        color: var(--blue);
        background: var(--bg);
      }

      .sidebar-bottom {
        margin-top: auto;
        border-top: 1px solid var(--border);
        padding-top: 10px;
      }
      .logout-link {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 8px 18px;
        font-size: 13px;
        color: #dc2626;
        text-decoration: none;
      }
      .logout-link:hover {
        background: #fef2f2;
      }
      .logout-link svg {
        width: 15px;
        height: 15px;
      }

      /* Main */
      .main {
        margin-left: var(--sidebar-w);
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      /* Topbar */
      .topbar {
        background: #fff;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 28px;
        height: 58px;
        position: sticky;
        top: 0;
        z-index: 40;
      }
      .topbar-greeting {
        font-size: 11px;
        color: var(--text-faint);
      }
      .topbar-username {
        font-size: 16px;
        font-weight: 600;
        color: var(--text);
      }
      .topbar-right {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .topbar-nav-btn {
        font-size: 13px;
        color: var(--text-muted);
        background: none;
        border: none;
        cursor: pointer;
        font-family: var(--font);
        padding: 4px 2px;
        text-decoration: none;
        transition: color 0.1s;
      }
      .topbar-nav-btn:hover {
        color: var(--text);
      }
      .avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--blue);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 600;
        flex-shrink: 0;
      }

      /* Page */
      .page {
        padding: 28px 32px;
        flex: 1;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <div class="sidebar-brand-sub">HR Platform</div>
          <div class="sidebar-brand-name">Intelligence<br />Suite</div>
        </div>

        <a href="#" class="sidebar-upload">
          <svg
            width="13"
            height="13"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
          >
            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" />
            <polyline points="17 8 12 3 7 8" />
            <line x1="12" y1="3" x2="12" y2="15" />
          </svg>
          Upload CSV / Excel
        </a>

        <div class="sidebar-section-label">Menu</div>

        <a
          href="{{ url_for('dashboard') }}"
          class="sidebar-item {% block nav_dashboard %}{% endblock %}"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <rect x="3" y="3" width="7" height="7" rx="1" />
            <rect x="14" y="3" width="7" height="7" rx="1" />
            <rect x="3" y="14" width="7" height="7" rx="1" />
            <rect x="14" y="14" width="7" height="7" rx="1" />
          </svg>
          Dashboard
        </a>

        <div class="sidebar-item" onclick="toggleSub('empSub')">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M23 21v-2a4 4 0 00-3-3.87" />
            <path d="M16 3.13a4 4 0 010 7.75" />
          </svg>
          Employees
        </div>
        <div class="sidebar-submenu" id="empSub">
          <a href="{{ url_for('add_manager') }}" class="sidebar-subitem"
            >Manager</a
          >
          <a href="{{ url_for('add_associate') }}" class="sidebar-subitem"
            >Associate</a
          >
        </div>

        <a
          href="{{ url_for('manage_dropdowns') }}"
          class="sidebar-item {% block nav_department %}{% endblock %}"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <line x1="8" y1="6" x2="21" y2="6" />
            <line x1="8" y1="12" x2="21" y2="12" />
            <line x1="8" y1="18" x2="21" y2="18" />
            <line x1="3" y1="6" x2="3.01" y2="6" />
            <line x1="3" y1="12" x2="3.01" y2="12" />
            <line x1="3" y1="18" x2="3.01" y2="18" />
          </svg>
          Department
        </a>

        <div class="sidebar-bottom">
          <div class="sidebar-section-label" style="margin-top: 10px">
            System
          </div>
          <a href="#" class="sidebar-item">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <circle cx="12" cy="12" r="3" />
              <path
                d="M19.07 4.93a10 10 0 010 14.14M4.93 4.93a10 10 0 000 14.14"
              />
            </svg>
            Settings
          </a>
          <a href="{{ url_for('logout') }}" class="logout-link">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
            Logout
          </a>
        </div>
      </aside>

      <div class="main">
        <header class="topbar">
          <div>
            <div class="topbar-greeting">
              Good {{ time_of_day if time_of_day is defined else 'afternoon' }}
            </div>
            <div class="topbar-username">{{ user }}</div>
          </div>
          <div class="topbar-right">
            <a
              href="{{ url_for('dashboard') }}?filter=manager"
              class="topbar-nav-btn"
              >Managers</a
            >
            <a
              href="{{ url_for('dashboard') }}?filter=associate"
              class="topbar-nav-btn"
              >Associates</a
            >
            <div class="avatar" id="topbarAvatar">?</div>
          </div>
        </header>
        <main class="page">{% block content %}{% endblock %}</main>
      </div>
    </div>
    <script>
      function toggleSub(id) {
        document.getElementById(id).classList.toggle("open");
      }
      const _u = "{{ user }}";
      document.getElementById("topbarAvatar").textContent = _u
        .split(" ")
        .map((x) => x[0])
        .join("")
        .slice(0, 2)
        .toUpperCase();
    </script>
  </body>
</html>
